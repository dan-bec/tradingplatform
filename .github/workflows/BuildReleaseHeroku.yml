name: Build and Release Heroku

on:
  push:
    branches: [ main ]

jobs:
  build-blazor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'
      - name: Build Blazor App
        run: |
          dotnet publish src/BullseyeApp/BullseyeApp.csproj -c Release -r browser-wasm
          mkdir -p bullseye-blazor
          cp -r src/BullseyeApp/bin/Release/net9.0/browser-wasm/publish/wwwroot/* bullseye-blazor/
      - name: Add static.json
        run: |
          echo '{ 
            "root": "index.html",
            "clean_urls": true,
            "routes": {
              "/**": "index.html"
            }
          }' > bullseye-blazor/static.json
      - name: Confirm publish contents
        run: find bullseye-blazor -type f | sort

  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
      - name: Build .NET Worker
        run: |
          cd src/BullseyeWorker
          dotnet publish -c Release -o ../../bullseye-worker
      - name: Create Procfile for Worker
        run: |
          echo 'worker: dotnet bullseye-worker/BullseyeWorker.dll'
          > Procfile
      - name: List Output Directory
        run: ls -la bullseye-worker/

  prepare-django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Move Django App
        run: |
          mkdir -p bullseye-platform
          cp -r src/site/* bullseye-platform/
          cd bullseye-platform/
          echo 'release: python manage.py migrate
            web: gunicorn bullseyesite.wsgi
          ' > Procfile
      - name: List Output Directory
        run: ls -la bullseye-platform/
